# Yiban IME / 译伴输入法
# Install at ~/.config/fcitx5/conf/bilingualcontext.conf (honors XDG_CONFIG_HOME).
# False disables sentence translation; Chinese input and word hints remain usable.
Enabled=True
# Empty uses $XDG_RUNTIME_DIR/bilingual-ime/translator.sock, or a per-user /tmp path.
# Custom paths must be absolute and use a dedicated parent directory.
SocketPath=
DebounceMs=200
# Currently supported: ollama, argos. URL is an Ollama base URL, not OpenAI /v1.
Backend=ollama
OllamaUrl=http://127.0.0.1:11434
OllamaModel=qwen3.5:0.8b
KeepAlive=5m
TimeoutSeconds=30
Warmup=True
# Required only for the optional argos backend.
ArgosModelPath=

[SentenceBoundaries]
0=space
1=.
2=!
3=?
4=。
5=！
6=？
