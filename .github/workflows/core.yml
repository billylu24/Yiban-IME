name: Core tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install core dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ python3 nlohmann-json3-dev
      - name: Configure
        run: cmake -S . -B build -DBILINGUAL_BUILD_ADDON=OFF -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
